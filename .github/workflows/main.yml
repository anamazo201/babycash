name: CI - BabyCash

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # ---------- Backend ----------
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend-babycash
        run: npm install
        with:
          cache: 'npm'
          cache-dependency-path: ./backend-babycash/package-lock.json

      - name: 🏗 Build Backend
        working-directory: ./backend-babycash
        run: npm run build

      - name: ✅ Test Backend
        working-directory: ./backend-babycash
        run: npm test

      - name: 🔍 Lint Backend
        working-directory: ./backend-babycash
        run: npm run lint

      # ---------- Frontend ----------
      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend-babycash
        run: npm install
        with:
          cache: 'npm'
          cache-dependency-path: ./frontend-babycash/package-lock.json

      - name: 🏗 Build Frontend
        working-directory: ./frontend-babycash
        run: npm run build

      - name: 🔍 Lint Frontend
        working-directory: ./frontend-babycash
        run: npm run lint
